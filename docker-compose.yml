services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3002}:${BACKEND_PORT:-3002}"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=development
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_CLUSTER=${MONGO_CLUSTER}
      - MONGO_APP_NAME=${MONGO_APP_NAME}
      - PORT=${BACKEND_PORT:-3002}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-8081}
    networks:
      - app-network
    # No DNS configuration needed as it was working without it

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-3002}
    depends_on:
      - backend
    networks:
      - app-network



networks:
  app-network:
    driver: bridge



volumes:
  frontend_node_modules:
  uploads_data:
