services:
  - type: web
    name: marketing-tool-free-tier
    runtime: node
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://marketing-tool-free-tier.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
    # HTTP headers are configured in the Render dashboard
    # or via environment variables
